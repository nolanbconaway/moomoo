version: 2

models:
  - name: artists
    description: Dimensional model containing information about artists.
    columns:
      - name: artist_mbid
        tests:
          - not_null
          - unique
      - name: artist_name
        tests:
          - not_null
      - name: artist_type
      - name: disambiguation
      - name: release_group_count
      - name: earliest_release_year
      - name: latest_release_year
      - name: active_years
      - name: tag_list
      - name: tags_string
      - name: last_updated

  - name: releases
    description: Dimensional model containing information about releases.
    columns:
      - name: release_mbid
        tests:
          - not_null
          - unique
      - name: release_group_mbid
        tests:
          - not_null
      - name: release_title
        tests:
          - not_null
      - name: artist_credit_phrase
        tests:
          - not_null
      - name: release_year
      - name: first_release_date
      - name: last_updated

  - name: release_groups
    description: Dimensional model containing information about release groups.
    columns:
      - name: release_group_mbid
        tests:
          - not_null
          - unique
      - name: release_group_title
        tests:
          - not_null
      - name: release_group_year
      - name: first_release_date
      - name: release_group_primary_type
      - name: release_count
      - name: artist_credit_phrase
      - name: last_updated

  - name: recordings
    description: Dimensional model containing information about recordings.
    columns:
      - name: recording_mbid
        tests:
          - not_null
          - unique
      - name: recording_title
        tests:
          - not_null
      - name: artist_credit_phrase
        tests:
          - not_null
      - name: recording_length_ms
      - name: last_updated