version: 2

sources:
  - name: musicbrainz
    schema: musicbrainz
    tables:
      - name: artist
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: name
          - name: sort_name
          - name: begin_date_year
          - name: begin_date_month
          - name: begin_date_day
          - name: end_date_year
          - name: end_date_month
          - name: end_date_day
          - name: type
          - name: area
          - name: gender
          - name: comment
          - name: last_updated

      - name: artist_credit
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: name
          - name: artist_count
          - name: ref_count
          - name: created

      - name: artist_credit_name
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [artist_credit, position]
        columns:
          - name: artist_credit
            tests: [not_null]
          - name: position
            tests: [not_null]
          - name: artist
          - name: name
          - name: join_phrase

      - name: release_gid_redirect
        columns:
          - name: gid
            tests: [not_null, unique]
          - name: new_id
          - name: created

      - name: release_group_gid_redirect
        columns:
          - name: gid
            tests: [not_null, unique]
          - name: new_id
          - name: created

      - name: recording_gid_redirect
        columns:
          - name: gid
            tests: [not_null, unique]
          - name: new_id
          - name: created

      - name: artist_gid_redirect
        columns:
          - name: gid
            tests: [not_null, unique]
          - name: new_id
          - name: created

      - name: artist_tag
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [artist, tag]
        columns:
          - name: artist
            tests: [not_null]
          - name: tag
            tests: [not_null]
          - name: count
          - name: last_updated

      - name: medium
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: release
          - name: position
          - name: format
          - name: name
          - name: track_count
          - name: last_updated

      - name: recording
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: name
          - name: artist_credit
          - name: length
          - name: comment
          - name: last_updated
          - name: video

      - name: recording_tag
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [recording, tag]
        columns:
          - name: recording
            tests: [not_null]
          - name: tag
            tests: [not_null]
          - name: count
          - name: last_updated

      - name: release
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: name
          - name: artist_credit
          - name: release_group
          - name: status
          - name: packaging
          - name: language
          - name: script
          - name: barcode
          - name: comment
          - name: quality
          - name: last_updated

      - name: release_first_release_date
        columns:
          - name: release
            tests: [not_null, unique]
          - name: year
          - name: month
          - name: day

      - name: release_group
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: name
          - name: artist_credit
          - name: type
          - name: comment
          - name: last_updated

      - name: release_group_meta
        columns:
          - name: id
            tests: [not_null, unique]
          - name: release_count
          - name: first_release_date_year
          - name: first_release_date_month
          - name: first_release_date_day
          - name: rating
          - name: rating_count

      - name: release_group_primary_type
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: name
          - name: parent
          - name: child_order
          - name: description

      - name: artist_type
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: name
          - name: parent
          - name: child_order
          - name: description

      - name: release_group_secondary_type
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: name
          - name: parent
          - name: child_order
          - name: description

      - name: release_group_secondary_type_join
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [release_group, secondary_type]
        columns:
          - name: release_group
            tests: [not_null]
          - name: secondary_type
            tests: [not_null]
          - name: created

      - name: tag
        columns:
          - name: id
            tests: [not_null, unique]
          - name: name
          - name: ref_count

      - name: release_group_tag
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [release_group, tag]
        columns:
          - name: release_group
            tests: [not_null]
          - name: tag
            tests: [not_null]
          - name: count
          - name: last_updated

      - name: release_status
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: name
          - name: parent
          - name: child_order
          - name: description

      - name: release_tag
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [release, tag]
        columns:
          - name: release
            tests: [not_null]
          - name: tag
            tests: [not_null]
          - name: count
          - name: last_updated

      - name: track
        columns:
          - name: id
            tests: [not_null, unique]
          - name: gid
          - name: recording
          - name: medium
          - name: position
          - name: number
          - name: name
          - name: artist_credit
          - name: length
          - name: is_data_track
          - name: last_updated

  - name: pyingest
    schema: public
    tables:
      - name: listenbrainz_listens
        description: Raw data ingested via python script.
        columns:
          - name: listen_md5
            tests:
              - not_null
              - unique

      - name: listenbrainz_user_feedback
        description: Feedback data ingested via python script.
        columns:
          - name: feedback_md5
            tests:
              - not_null
              - unique

      - name: local_music_embeddings
        description: Embeddings from the ml service.
        columns:
          - name: filepath
            tests:
              - not_null
              - unique 

      - name: local_music_files
        description: Raw local files data ingested via python script.
        columns:
          - name: filepath
            tests:
              - not_null
              - unique 
      
      - name: local_music_files_birth_timestamps
        description: Birth timestamps for local music files.
        columns:
          - name: filepath
            tests:
              - not_null
              - unique 
          - name: birth_at
            tests:
              - not_null
          - name: insert_ts_utc
            tests:
              - not_null

      - name: messybrainz_name_map
        description: Mapped local file data to musicbrainz data.
        columns:
          - name: recording_md5
            tests:
              - not_null
              - unique 

      - name: musicbrainz_annotations
        description: Annotated data from musicbrainz. Long format, uniqe on mbid.
        columns:
          - name: mbid
            tests:
              - not_null
              - unique 
          - name: entity
            tests:
              - not_null
          - name: ts_utc
            tests:
              - not_null
          - name: payload_json

      - name: listenbrainz_similar_user_activity
        description: Activity from users marked as similar on Listenbrainz.
        columns:
          - name: payload_id
            tests:
              - not_null
              - unique 
          - name: from_username
            tests:
              - not_null
          - name: to_username
            tests:
              - not_null
          - name: entity
            tests:
              - not_null
          - name: time_range
            tests:
              - not_null
          - name: user_similarity
            tests:
              - not_null
          - name: json_data
            tests:
              - not_null
          - name: insert_ts_utc
            tests:
              - not_null

      - name: listenbrainz_artist_stats
        description: Artist stats from listenbrainz.
        columns:
          - name: mbid
            tests:
              - not_null
              - unique 
          - name: payload_json
            tests:
              - not_null
          - name: ts_utc
            tests:
              - not_null

      - name: moomoo_playlist_collections
        description: Playlist collections generated by moomoo.
        columns:
          - name: collection_id
          - name: collection_name
          - name: username
          - name: refresh_at_hours_utc
          - name: create_at_utc
          - name: refreshed_at_utc

      - name: moomoo_playlists
        identifier: moomoo_playlist_collection_items
        description: Playlists generated by moomoo.
        columns:
          - name: playlist_id
          - name: collection_id
          - name: collection_order_index
          - name: title
          - name: description
          - name: playlist
          - name: create_at_utc

      - name: moomoo_playlist_tracks
        description: Playlist tracks in each playlist generated by moomoo.
        columns:
          - name: track_id
          - name: playlist_id
          - name: track_order_index
          - name: filepath
          - name: recording_mbid
          - name: release_mbid
          - name: release_group_mbid
          - name: artist_mbid
          - name: album_artist_mbid
          - name: track_length_seconds
          - name: match_distance
          - name: is_seed


      - name: listenbrainz_data_dumps
        description: Data dumps from Listenbrainz for archival purposes.
        columns:
          - name: slug
          - name: ftp_path
          - name: ftp_modify_ts
          - name: date
          - name: start_timestamp
          - name: end_timestamp
          - name: created_at
          - name: refreshed_at

      - name: listenbrainz_data_dump_records
        description: User artist aggregated data from Listenbrainz data dumps.
        columns:
          - name: dump_record_id
          - name: slug
          - name: user_id
          - name: artist_mbid
          - name: listen_count

      - name: listenbrainz_collaborative_filtering_scores
        description: Collaborative filtering scores between artist pairs.
        columns:
          - name: mbid_pair_id
            description: Primary key.
          - name: artist_mbid_a
            description: First artist MBID.
          - name: artist_mbid_b
            description: Second artist MBID.
          - name: score_value
            description: Collaborative filtering score.
          - name: insert_ts_utc
            description: Timestamp of insertion